name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    check-${{ github.workflow }}-${{
    github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  flake-evaluation:
    name: Evaluate flake
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # nix-installer-action v22
      - uses: "DeterminateSystems/nix-installer-action@\
          ef8a148080ab6020fd15196c2084a2eea5ff2d25"
      - run: nix flake check --all-systems --no-build --accept-flake-config

  lightweight-checks:
    name: Build lightweight checks
    needs: flake-evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # nix-installer-action v22
      - uses: "DeterminateSystems/nix-installer-action@\
          ef8a148080ab6020fd15196c2084a2eea5ff2d25"
      - run: |
          nix build \
            --no-link \
            --print-build-logs \
            --accept-flake-config \
            .#checks.x86_64-linux.configurations \
            .#checks.x86_64-linux.rtk \
            .#checks.x86_64-linux.neovim \
            .#checks.x86_64-linux.yazi \
            .#checks.x86_64-linux.lazygit \
            .#checks.x86_64-linux.pi \
            .#checks.x86_64-linux.pi-fast-extension \
            .#checks.x86_64-linux.pi-tools \
            .#checks.x86_64-linux.nushell-config

  full-home-profile:
    name: Build full Linux home profile (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # nix-installer-action v22
      - uses: "DeterminateSystems/nix-installer-action@\
          ef8a148080ab6020fd15196c2084a2eea5ff2d25"
      - run: |
          nix build \
            --no-link \
            --print-build-logs \
            --accept-flake-config \
            .#checks.x86_64-linux.home-profile
